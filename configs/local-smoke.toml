# 烟测：用 q1_v3 资产 + 转换好的 50Hz 训练数据跑 2 轮，验证管线通路。
[train]
robot_xml = "../assets/q1_v3/xml/q1_v3_mc.xml"
motion_dir = "../datasets/train_50hz/motion_lafan/complex_motion"
